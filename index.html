<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة دارك FM - صانع الأخبار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #e11d48;
            --theme-bg: rgba(225, 29, 72, 0.9);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .preview-header {
            width: 100%;
            background: #1e293b;
            padding: 15px 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        #news-canvas {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1f2937, #111827);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        #img-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }

        #bg-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
        }

        .img-with-border {
            border: 5px solid var(--theme-color) !important;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
            z-index: 1;
        }

        .urgent-tag {
            background: var(--theme-color);
            color: white;
            padding: 2px 12px;
            font-weight: 900;
            font-size: 12px;
            display: inline-block;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
        }

        .content-area {
            position: absolute;
            left: 12px;
            right: 12px;
            z-index: 2;
        }

        .content-image-mode {
            bottom: 40px;
        }

        .content-text-mode {
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid var(--theme-color);
        }

        .logo-area {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
        }

        .social-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid var(--theme-color);
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .controls-container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .control-group {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: block;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
        }

        .theme-btn {
            height: 40px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            margin: 15px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--theme-color);
            border-radius: 50%;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            resize: none;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            margin-top: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* ظلال النصوص */
        .strong-text-shadow {
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.9), 0px 1px 4px rgba(0, 0, 0, 1), 0px 0px 2px rgba(0, 0, 0, 1);
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <div id="news-canvas">
            <div id="img-container">
                <img id="bg-preview" src="" alt="" style="display: none;">
            </div>
            <div id="gradient-overlay" class="gradient-overlay" style="display: none;"></div>

            <div class="logo-area">
                <div class="bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded border border-gray-400/50">
                    <div class="flex flex-col text-right">
                        <h1 class="text-sm font-black text-white leading-tight strong-text-shadow">إذاعة دارك</h1>
                        <p class="text-[7px] text-gray-200 font-bold uppercase tracking-widest strong-text-shadow">94.3 FM</p>
                    </div>
                </div>
            </div>

            <div id="content-container" class="content-area content-text-mode">
                <div id="urgent-badge" class="urgent-tag mb-1 shadow-md">عاجل</div>
                <div id="display-text" class="font-bold leading-tight text-white mb-2 strong-text-shadow" style="font-size: 18px;">
                    اكتب تفاصيل الخبر هنا ليظهر بشكل احترافي
                </div>
                <div id="theme-line" class="h-1 w-12 mb-1" style="background-color: var(--theme-color); box-shadow: 0px 1px 3px rgba(0,0,0,0.8);"></div>
                <div id="display-date" class="text-gray-200 text-[8px] font-bold strong-text-shadow"></div>
            </div>

            <div class="social-footer">
                <span class="text-[8px] font-bold text-white strong-text-shadow">تابع إذاعة دارك</span>
                <div class="flex items-center space-x-reverse space-x-2">
                    <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-container">
        <!-- قسم القوالب -->
        <div class="control-group">
            <span class="section-title">نوع الخبر</span>
            <div class="theme-grid">
                <button onclick="updateTheme('news')" class="theme-btn bg-red-600">عاجل</button>
                <button onclick="updateTheme('sports')" class="theme-btn bg-green-600">رياضة</button>
                <button onclick="updateTheme('appeals')" class="theme-btn bg-orange-600">مناشدة</button>
                <button onclick="updateTheme('entertainment')" class="theme-btn bg-purple-600">ترفيه</button>
                <button onclick="updateTheme('tech')" class="theme-btn bg-cyan-600">تقنية</button>
            </div>
        </div>

        <!-- قسم النص -->
        <div class="control-group">
            <div class="flex justify-between items-center mb-2">
                <span class="section-title m-0">محتوى الخبر</span>
                <div class="flex gap-2">
                    <button id="paste-btn" class="text-[10px] text-green-400 font-bold bg-gray-800 px-2 py-1 rounded">لصق سريع</button>
                    <button id="toggle-urgent-btn" class="text-[10px] text-blue-400 font-bold bg-gray-800 px-2 py-1 rounded">تبديل العلامة</button>
                </div>
            </div>
            <textarea id="text-input" rows="2" placeholder="أدخل نص الخبر هنا..."></textarea>
            
            <div class="mt-4">
                <div class="flex justify-between text-[10px] font-bold text-gray-400">
                    <span>حجم الخط</span>
                    <span id="font-val">18px</span>
                </div>
                <input type="range" id="font-size-slider" min="8" max="40" value="18">
            </div>
        </div>

        <!-- قسم الصورة -->
        <div class="control-group">
            <span class="section-title">إعدادات الصورة</span>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <label class="bg-gray-700 p-2 rounded-xl flex items-center justify-center cursor-pointer active:bg-gray-600 text-center">
                    <span class="text-[10px] font-bold">اختر صورة</span>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                <button id="toggle-fit-btn" class="bg-gray-700 p-2 rounded-xl text-[10px] font-bold active:bg-gray-600">احتواء الصورة</button>
                <button id="toggle-border-btn" class="bg-gray-700 p-2 rounded-xl text-[10px] font-bold active:bg-gray-600">إضافة إطار</button>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="remove-image-btn" class="text-[10px] text-red-400 font-bold bg-red-900/30 px-2 py-1 rounded">حذف</button>
                <div class="flex-1">
                    <input type="range" id="img-scale-slider" min="50" max="150" value="100">
                </div>
            </div>
        </div>

        <!-- أزرار الإجراءات -->
        <button id="download-btn" class="action-btn bg-green-600 text-white shadow-lg border-b-4 border-green-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            حفظ في الاستوديو
        </button>

        <button id="share-btn" class="action-btn bg-gradient-to-r from-blue-600 via-purple-500 to-pink-500 text-white shadow-lg border-b-4 border-pink-700 mt-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
            مشاركة (فيسبوك / انستغرام)
        </button>
    </div>

    <script>
        const canvas = document.getElementById('news-canvas');
        const textInput = document.getElementById('text-input');
        const displayText = document.getElementById('display-text');
        const urgentBadge = document.getElementById('urgent-badge');
        const bgPreview = document.getElementById('bg-preview');
        const imageInput = document.getElementById('image-input');
        const container = document.getElementById('content-container');
        const gradient = document.getElementById('gradient-overlay');
        const themeLine = document.getElementById('theme-line');

        const themes = {
            news: { color: '#e11d48', label: 'عاجل' },
            sports: { color: '#16a34a', label: 'رياضة' },
            appeals: { color: '#ea580c', label: 'مناشدة' },
            entertainment: { color: '#9333ea', label: 'ترفيه' },
            tech: { color: '#06b6d4', label: 'تكنولوجيا' }
        };

        window.updateTheme = function(t) {
            const data = themes[t];
            document.documentElement.style.setProperty('--theme-color', data.color);
            urgentBadge.innerText = data.label;
            urgentBadge.style.backgroundColor = data.color;
            themeLine.style.backgroundColor = data.color;
        };

        textInput.addEventListener('input', (e) => {
            displayText.innerText = e.target.value || 'اكتب تفاصيل الخبر هنا ليظهر بشكل احترافي';
        });

        document.getElementById('font-size-slider').addEventListener('input', (e) => {
            displayText.style.fontSize = e.target.value + 'px';
            document.getElementById('font-val').innerText = e.target.value + 'px';
        });

        let badgeVisible = true;
        document.getElementById('toggle-urgent-btn').addEventListener('click', () => {
            badgeVisible = !badgeVisible;
            urgentBadge.style.display = badgeVisible ? 'inline-block' : 'none';
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bgPreview.src = event.target.result;
                    bgPreview.style.display = 'block';
                    gradient.style.display = 'block';
                    container.className = 'content-area content-image-mode';
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('remove-image-btn').addEventListener('click', () => {
            bgPreview.style.display = 'none';
            gradient.style.display = 'none';
            container.className = 'content-area content-text-mode';
            imageInput.value = '';
        });

        document.getElementById('img-scale-slider').addEventListener('input', (e) => {
            const s = e.target.value / 100;
            bgPreview.style.transform = `scale(${s})`;
        });

        let borderActive = false;
        document.getElementById('toggle-border-btn').addEventListener('click', (e) => {
            borderActive = !borderActive;
            bgPreview.classList.toggle('img-with-border', borderActive);
            e.target.innerText = borderActive ? 'إزالة الإطار' : 'إضافة إطار';
        });

        // خاصية احتواء الصورة (لمنع القص)
        let isContain = false;
        document.getElementById('toggle-fit-btn').addEventListener('click', (e) => {
            isContain = !isContain;
            bgPreview.style.objectFit = isContain ? 'contain' : 'cover';
            e.target.innerText = isContain ? 'ملء الصورة' : 'احتواء الصورة';
            e.target.classList.toggle('bg-blue-600', isContain);
        });

        // خاصية اللصق السريع
        document.getElementById('paste-btn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if(text) {
                    textInput.value = text;
                    displayText.innerText = text;
                }
            } catch (err) {
                // تظهر هذه الرسالة إذا كان المتصفح أو التطبيق يمنع الوصول التلقائي للحافظة لدواعي أمنية
                alert('عذراً، التطبيق يحتاج صلاحية أو يمنع الوصول التلقائي للحافظة. يرجى النقر مطولاً داخل المربع واختيار "لصق".');
            }
        });

        const d = new Date();
        document.getElementById('display-date').innerText = d.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});

        // دالة التقاط الصورة المشتركة
        async function captureCanvas() {
            await document.fonts.ready;
            const canvasOut = await html2canvas(canvas, { scale: 3, useCORS: true });
            return canvasOut.toDataURL('image/png');
        }

        // زر الحفظ
        document.getElementById('download-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'جاري الحفظ...';
            try {
                const imgData = await captureCanvas();
                if (window.Android && window.Android.saveImage) {
                    window.Android.saveImage(imgData.split(',')[1]);
                } else {
                    const link = document.createElement('a');
                    link.download = `DarkFM_${Date.now()}.png`;
                    link.href = imgData;
                    link.click();
                }
            } catch (err) {
                console.error(err);
            }
            btn.innerHTML = originalHTML;
        });

        // زر المشاركة الجديد
        document.getElementById('share-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'جاري التجهيز...';
            try {
                const imgData = await captureCanvas();
                
                // 1. الاتصال بتطبيق الأندرويد لفتح نافذة المشاركة
                if (window.Android && window.Android.shareImage) {
                    window.Android.shareImage(imgData.split(',')[1]);
                } 
                // 2. إذا كان يعمل في متصفح ويب يدعم المشاركة (Web Share API)
                else {
                    const res = await fetch(imgData);
                    const blob = await res.blob();
                    const file = new File([blob], 'DarkFM_News.png', { type: 'image/png' });
                    
                    if (navigator.share && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'خبر من إذاعة دارك',
                            files: [file]
                        });
                    } else {
                        alert('عذراً، ميزة المشاركة المباشرة تتطلب تطبيق الأندرويد.');
                    }
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء محاولة المشاركة');
            }
            btn.innerHTML = originalHTML;
        });
    </script>
</body>
</html>
