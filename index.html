<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة دارك FM - صانع الأخبار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #e11d48;
            --theme-bg: rgba(225, 29, 72, 0.9);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .preview-header {
            width: 100%;
            background: #1e293b;
            padding: 15px 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        #news-canvas {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1; /* القيمة الافتراضية */
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1f2937, #111827);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            transition: aspect-ratio 0.3s ease; /* حركة سلسة عند تغيير الأبعاد */
        }

        #img-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }

        #bg-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
        }

        .img-with-border {
            border: 5px solid var(--theme-color) !important;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
            z-index: 1;
        }

        .urgent-tag {
            background: var(--theme-color);
            color: white;
            padding: 2px 12px;
            font-weight: 900;
            font-size: 12px;
            display: inline-block;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
        }

        .content-area {
            position: absolute;
            left: 12px;
            right: 12px;
            z-index: 2;
        }

        .content-image-mode {
            bottom: 40px;
        }

        .content-text-mode {
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid var(--theme-color);
        }

        /* كلاس الخلفية الشفافة للنص المضاف حديثاً */
        .text-backdrop {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border-right: 3px solid var(--theme-color);
        }

        .logo-area {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
        }

        .social-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid var(--theme-color);
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .controls-container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .control-group {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: block;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
        }

        .theme-btn {
            height: 40px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            margin: 15px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--theme-color);
            border-radius: 50%;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            resize: none;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            margin-top: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .strong-text-shadow {
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.9), 0px 1px 4px rgba(0, 0, 0, 1), 0px 0px 2px rgba(0, 0, 0, 1);
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <div id="news-canvas">
            <div id="img-container">
                <img id="bg-preview" src="" alt="" style="display: none;">
            </div>
            <div id="gradient-overlay" class="gradient-overlay" style="display: none;"></div>

            <div class="logo-area">
                <div class="bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded border border-gray-400/50">
                    <div class="flex flex-col text-right">
                        <h1 class="text-sm font-black text-white leading-tight strong-text-shadow">إذاعة دارك</h1>
                        <p class="text-[7px] text-gray-200 font-bold uppercase tracking-widest strong-text-shadow">94.3 FM</p>
                    </div>
                </div>
            </div>

            <div id="content-container" class="content-area content-text-mode">
                <div id="urgent-badge" class="urgent-tag mb-1 shadow-md">عاجل</div>
                <div id="display-text" class="font-bold leading-tight text-white mb-2 strong-text-shadow transition-all duration-300" style="font-size: 18px;">
                    اكتب تفاصيل الخبر هنا ليظهر بشكل احترافي
                </div>
                <div id="theme-line" class="h-1 w-12 mb-1 transition-all duration-300" style="background-color: var(--theme-color); box-shadow: 0px 1px 3px rgba(0,0,0,0.8);"></div>
                <div id="display-date" class="text-gray-200 text-[8px] font-bold strong-text-shadow"></div>
            </div>

            <div class="social-footer">
                <span class="text-[8px] font-bold text-white strong-text-shadow">تابع إذاعة دارك</span>
                <div class="flex items-center space-x-reverse space-x-2">
                    <svg class="fill-white w-2.5 h-2.5" viewBox="0 0 320 512"><path d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/></svg>
                    <svg class="fill-white w-3 h-3" viewBox="0 0 448 512"><path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>
                    <svg class="fill-white w-2.5 h-2.5" viewBox="0 0 448 512"><path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31v89.89a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14Z"/></svg>
                    <svg class="fill-white w-3 h-3" viewBox="0 0 512 512"><path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"/></svg>
                    <svg class="fill-white w-3 h-3" viewBox="0 0 496 512"><path d="M248 8C111 8 0 119 0 256s111 248 248 248 248-111 248-248S385 8 248 8zm114.9 168.6c-4.2 24.5-22.9 122.9-32.5 170.2-4.1 20.4-11.6 27.2-18.8 27.9-15.5 1.4-27.2-10.2-42.1-20-23.5-15.3-36.8-24.7-59.5-39.7-26-17.1-9.2-26.6 5.8-42.1 3.9-4.1 72.1-66.2 73.4-71.8 1.5-6.7-1.1-9.4-4.5-9.4-4.1 0-25.5 14.1-72.1 45.6-68.3 46.1-98.3 58-132.9 57.1-23.4-.6-68.7-13.3-102.3-24.2-40.4-13.1-72.5-20.1-69.7-42.5 1.5-11.9 17.5-24.2 48-37.1 187.9-81.8 313.1-133.7 375.6-159.5 17.9-7.4 35.3-12.7 49-13.1 13.1-.4 27.9 3 36.3 11.4 6 6 8.3 14.1 9.4 22 1.2 10.1.7 21.8-.7 34.6z"/></svg>
                    <svg class="fill-white w-3 h-3" viewBox="0 0 576 512"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-container">
        
        <!-- قسم الأبعاد المضاف حديثاً -->
        <div class="control-group">
            <span class="section-title">أبعاد الصورة</span>
            <div class="flex gap-2">
                <button onclick="setAspectRatio('1/1')" id="btn-ratio-1-1" class="flex-1 bg-blue-600 p-2 rounded-xl text-[12px] font-bold transition-colors">مربع (1:1)</button>
                <button onclick="setAspectRatio('4/5')" id="btn-ratio-4-5" class="flex-1 bg-gray-700 p-2 rounded-xl text-[12px] font-bold transition-colors">طولي (4:5)</button>
            </div>
        </div>

        <!-- قسم القوالب -->
        <div class="control-group">
            <span class="section-title">نوع الخبر</span>
            <div class="theme-grid">
                <button onclick="updateTheme('news')" class="theme-btn bg-red-600">عاجل</button>
                <button onclick="updateTheme('sports')" class="theme-btn bg-green-600">رياضة</button>
                <button onclick="updateTheme('appeals')" class="theme-btn bg-orange-600">مناشدة</button>
                <button onclick="updateTheme('entertainment')" class="theme-btn bg-purple-600">ترفيه</button>
                <button onclick="updateTheme('tech')" class="theme-btn bg-cyan-600">تقنية</button>
            </div>
        </div>

        <!-- قسم النص -->
        <div class="control-group">
            <div class="flex justify-between items-center mb-2">
                <span class="section-title m-0">محتوى الخبر</span>
                <div class="flex gap-2 flex-wrap justify-end">
                    <!-- زر إضافة الخلفية للنص -->
                    <button id="toggle-text-bg-btn" class="text-[10px] text-yellow-400 font-bold bg-gray-800 px-2 py-1 rounded border border-yellow-900/50">خلفية للنص</button>
                    <button id="toggle-urgent-btn" class="text-[10px] text-blue-400 font-bold bg-gray-800 px-2 py-1 rounded">تبديل العلامة</button>
                    <button id="paste-btn" class="text-[10px] text-green-400 font-bold bg-gray-800 px-2 py-1 rounded">لصق سريع</button>
                </div>
            </div>
            <textarea id="text-input" rows="3" placeholder="أدخل نص الخبر هنا..."></textarea>
            
            <div class="mt-4">
                <div class="flex justify-between text-[10px] font-bold text-gray-400">
                    <span>حجم الخط</span>
                    <span id="font-val">18px</span>
                </div>
                <input type="range" id="font-size-slider" min="8" max="40" value="18">
            </div>
        </div>

        <!-- قسم الصورة -->
        <div class="control-group">
            <span class="section-title">إعدادات الصورة</span>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <label class="bg-gray-700 p-2 rounded-xl flex items-center justify-center cursor-pointer active:bg-gray-600 text-center">
                    <span class="text-[10px] font-bold">اختر صورة</span>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                <button id="toggle-fit-btn" class="bg-gray-700 p-2 rounded-xl text-[10px] font-bold active:bg-gray-600">احتواء الصورة</button>
                <button id="toggle-border-btn" class="bg-gray-700 p-2 rounded-xl text-[10px] font-bold active:bg-gray-600">إضافة إطار</button>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="remove-image-btn" class="text-[10px] text-red-400 font-bold bg-red-900/30 px-2 py-1 rounded">حذف</button>
                <div class="flex-1">
                    <input type="range" id="img-scale-slider" min="50" max="150" value="100">
                </div>
            </div>
        </div>

        <!-- أزرار الإجراءات -->
        <button id="download-btn" class="action-btn bg-green-600 text-white shadow-lg border-b-4 border-green-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            حفظ في الاستوديو
        </button>

        <button id="share-btn" class="action-btn bg-gradient-to-r from-blue-600 via-purple-500 to-pink-500 text-white shadow-lg border-b-4 border-pink-700 mt-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
            مشاركة (فيسبوك / انستغرام)
        </button>
    </div>

    <script>
        const canvas = document.getElementById('news-canvas');
        const textInput = document.getElementById('text-input');
        const displayText = document.getElementById('display-text');
        const urgentBadge = document.getElementById('urgent-badge');
        const bgPreview = document.getElementById('bg-preview');
        const imageInput = document.getElementById('image-input');
        const container = document.getElementById('content-container');
        const gradient = document.getElementById('gradient-overlay');
        const themeLine = document.getElementById('theme-line');

        // دالة تغيير أبعاد الصورة (الميزة الجديدة)
        window.setAspectRatio = function(ratio) {
            canvas.style.aspectRatio = ratio;
            if(ratio === '1/1') {
                document.getElementById('btn-ratio-1-1').classList.replace('bg-gray-700', 'bg-blue-600');
                document.getElementById('btn-ratio-4-5').classList.replace('bg-blue-600', 'bg-gray-700');
            } else {
                document.getElementById('btn-ratio-4-5').classList.replace('bg-gray-700', 'bg-blue-600');
                document.getElementById('btn-ratio-1-1').classList.replace('bg-blue-600', 'bg-gray-700');
            }
        };

        const themes = {
            news: { color: '#e11d48', label: 'عاجل' },
            sports: { color: '#16a34a', label: 'رياضة' },
            appeals: { color: '#ea580c', label: 'مناشدة' },
            entertainment: { color: '#9333ea', label: 'ترفيه' },
            tech: { color: '#06b6d4', label: 'تكنولوجيا' }
        };

        window.updateTheme = function(t) {
            const data = themes[t];
            document.documentElement.style.setProperty('--theme-color', data.color);
            urgentBadge.innerText = data.label;
            urgentBadge.style.backgroundColor = data.color;
            themeLine.style.backgroundColor = data.color;
        };

        textInput.addEventListener('input', (e) => {
            displayText.innerText = e.target.value || 'اكتب تفاصيل الخبر هنا ليظهر بشكل احترافي';
        });

        document.getElementById('font-size-slider').addEventListener('input', (e) => {
            displayText.style.fontSize = e.target.value + 'px';
            document.getElementById('font-val').innerText = e.target.value + 'px';
        });

        // زر خلفية النص (الميزة الجديدة)
        let textBgActive = false;
        document.getElementById('toggle-text-bg-btn').addEventListener('click', (e) => {
            textBgActive = !textBgActive;
            if(textBgActive) {
                displayText.classList.add('text-backdrop');
                e.target.innerText = 'إزالة الخلفية للنص';
                e.target.classList.replace('text-yellow-400', 'text-red-400');
                e.target.classList.replace('border-yellow-900/50', 'border-red-900/50');
            } else {
                displayText.classList.remove('text-backdrop');
                e.target.innerText = 'خلفية للنص';
                e.target.classList.replace('text-red-400', 'text-yellow-400');
                e.target.classList.replace('border-red-900/50', 'border-yellow-900/50');
            }
        });

        let badgeVisible = true;
        document.getElementById('toggle-urgent-btn').addEventListener('click', () => {
            badgeVisible = !badgeVisible;
            urgentBadge.style.display = badgeVisible ? 'inline-block' : 'none';
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bgPreview.src = event.target.result;
                    bgPreview.style.display = 'block';
                    gradient.style.display = 'block';
                    container.className = 'content-area content-image-mode';
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('remove-image-btn').addEventListener('click', () => {
            bgPreview.style.display = 'none';
            gradient.style.display = 'none';
            container.className = 'content-area content-text-mode';
            imageInput.value = '';
        });

        document.getElementById('img-scale-slider').addEventListener('input', (e) => {
            const s = e.target.value / 100;
            bgPreview.style.transform = `scale(${s})`;
        });

        let borderActive = false;
        document.getElementById('toggle-border-btn').addEventListener('click', (e) => {
            borderActive = !borderActive;
            bgPreview.classList.toggle('img-with-border', borderActive);
            e.target.innerText = borderActive ? 'إزالة الإطار' : 'إضافة إطار';
        });

        let isContain = false;
        document.getElementById('toggle-fit-btn').addEventListener('click', (e) => {
            isContain = !isContain;
            bgPreview.style.objectFit = isContain ? 'contain' : 'cover';
            e.target.innerText = isContain ? 'ملء الصورة' : 'احتواء الصورة';
            e.target.classList.toggle('bg-blue-600', isContain);
        });

        document.getElementById('paste-btn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if(text) {
                    textInput.value = text;
                    displayText.innerText = text;
                }
            } catch (err) {
                alert('عذراً، التطبيق يحتاج صلاحية أو يمنع الوصول التلقائي للحافظة. يرجى النقر مطولاً داخل المربع واختيار "لصق".');
            }
        });

        const d = new Date();
        document.getElementById('display-date').innerText = d.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});

        async function captureCanvas() {
            await document.fonts.ready;
            const canvasOut = await html2canvas(canvas, { scale: 3, useCORS: true });
            return canvasOut.toDataURL('image/png');
        }

        document.getElementById('download-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'جاري الحفظ...';
            try {
                const imgData = await captureCanvas();
                if (window.Android && window.Android.saveImage) {
                    window.Android.saveImage(imgData.split(',')[1]);
                } else {
                    const link = document.createElement('a');
                    link.download = `DarkFM_${Date.now()}.png`;
                    link.href = imgData;
                    link.click();
                }
            } catch (err) {
                console.error(err);
            }
            btn.innerHTML = originalHTML;
        });

        document.getElementById('share-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'جاري التجهيز...';
            try {
                const imgData = await captureCanvas();
                
                if (window.Android && window.Android.shareImage) {
                    window.Android.shareImage(imgData.split(',')[1]);
                } 
                else {
                    const res = await fetch(imgData);
                    const blob = await res.blob();
                    const file = new File([blob], 'DarkFM_News.png', { type: 'image/png' });
                    
                    if (navigator.share && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'خبر من إذاعة دارك',
                            files: [file]
                        });
                    } else {
                        alert('عذراً، ميزة المشاركة المباشرة تتطلب تطبيق الأندرويد.');
                    }
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء محاولة المشاركة');
            }
            btn.innerHTML = originalHTML;
        });
    </script>
</body>
</html>
